<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PE Fitness Components Matching Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 8px;
    }

    p.instructions {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 768px) {
      .game-grid {
        grid-template-columns: 1fr;
      }
    }

    .column-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #334155;
      text-align: center;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      padding: 12px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      line-height: 1.4;
      user-select: none;
    }

    .card:hover {
      border-color: #94a3b8;
      background: #f1f5f9;
    }

    /* Selected state */
    .card.selected {
      border-color: #2563eb !important;
      background: #eff6ff !important;
      box-shadow: 0 0 0 2px #2563eb;
    }

    /* Correct match state */
    .card.correct {
      border-color: #16a34a !important;
      background: #dcfce7 !important;
      color: #14532d !important;
      font-weight: 600;
      cursor: default;
      pointer-events: none;
    }

    /* Incorrect match state */
    .card.incorrect {
      border-color: #dc2626 !important;
      background: #fee2e2 !important;
      color: #7f1d1d !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .badge-hrf {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .badge-srf {
      background-color: #fef3c7;
      color: #92400e;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .score-board {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e293b;
    }

    .btn-reset {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background-color: #2563eb;
      color: white;
      transition: background 0.2s ease;
    }

    .btn-reset:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>PE Fitness Components Match</h1>
  <p class="instructions">Click a <strong>Sports Scenario</strong> on the left, then click its matching <strong>Fitness Component</strong> on the right.</p>

  <div class="game-grid">
    <div>
      <div class="column-title">Sports Scenarios</div>
      <div class="card-list" id="scenarios-list"></div>
    </div>
    <div>
      <div class="column-title">Fitness Components</div>
      <div class="card-list" id="components-list"></div>
    </div>
  </div>

  <div class="controls">
    <div class="score-board" id="score-board">Score: 0 / 10</div>
    <button class="btn-reset" onclick="resetGame()">Reset Game</button>
  </div>
</div>

<script>
  const data = [
    { id: 1, scenario: "A 100m sprinter launches off the blocks the instant the starter pistol fires.", component: "Reaction Time", type: "SRF" },
    { id: 2, scenario: "A gymnast holds a perfectly still handstand on the balance beam without swaying.", component: "Balance", type: "SRF" },
    { id: 3, scenario: "A tennis player tracks a fast ball and swings their racket to hit a clean volley.", component: "Coordination", type: "SRF" },
    { id: 4, scenario: "A high jumper explodes off the track using max force and speed to clear the bar.", component: "Power", type: "SRF" },
    { id: 5, scenario: "A swimmer pushes off the wall to complete a 50m dash in the fastest time.", component: "Speed", type: "SRF" },
    { id: 6, scenario: "A basketball player cuts sharply left, dodges a defender, and spins right.", component: "Agility", type: "SRF" },
    { id: 7, scenario: "A marathon runner keeps moving for 42 km while their heart & lungs supply oxygen.", component: "Cardiovascular Endurance", type: "HRF" },
    { id: 8, scenario: "A weightlifter exerts maximal force to lift a 120kg barbell overhead once.", component: "Muscular Strength", type: "HRF" },
    { id: 9, scenario: "A swimmer performs 50 continuous push-ups during dryland training.", component: "Muscular Endurance", type: "HRF" },
    { id: 10, scenario: "A hurdle runner reaches their leg over the barrier without hamstring tightness.", component: "Flexibility", type: "HRF" }
  ];

  let selectedScenario = null;
  let selectedComponent = null;
  let matchesCount = 0;
  let isChecking = false;

  function shuffle(array) {
    return array.slice().sort(() => Math.random() - 0.5);
  }

  function initGame() {
    selectedScenario = null;
    selectedComponent = null;
    matchesCount = 0;
    isChecking = false;
    document.getElementById('score-board').textContent = "Score: 0 / 10";

    const scenariosContainer = document.getElementById('scenarios-list');
    const componentsContainer = document.getElementById('components-list');

    scenariosContainer.innerHTML = '';
    componentsContainer.innerHTML = '';

    // Independently jumble both columns
    const shuffledScenarios = shuffle(data);
    const shuffledComponents = shuffle(data);

    shuffledScenarios.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;
      card.textContent = item.scenario;
      card.onclick = () => selectScenario(card, item.id);
      scenariosContainer.appendChild(card);
    });

    shuffledComponents.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;
      card.innerHTML = `${item.component} <span class="badge ${item.type === 'HRF' ? 'badge-hrf' : 'badge-srf'}">${item.type}</span>`;
      card.onclick = () => selectComponent(card, item.id);
      componentsContainer.appendChild(card);
    });
  }

  function selectScenario(card, id) {
    if (isChecking || card.classList.contains('correct')) return;
    
    document.querySelectorAll('#scenarios-list .card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedScenario = { element: card, id: id };
    
    checkPair();
  }

  function selectComponent(card, id) {
    if (isChecking || card.classList.contains('correct')) return;

    document.querySelectorAll('#components-list .card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedComponent = { element: card, id: id };

    checkPair();
  }

  function checkPair() {
    if (selectedScenario && selectedComponent) {
      isChecking = true;
      const scenEl = selectedScenario.element;
      const compEl = selectedComponent.element;

      if (selectedScenario.id === selectedComponent.id) {
        // CORRECT MATCH -> Turn Green
        scenEl.classList.remove('selected');
        compEl.classList.remove('selected');

        scenEl.classList.add('correct');
        compEl.classList.add('correct');

        matchesCount++;
        document.getElementById('score-board').textContent = `Score: ${matchesCount} / 10`;

        if (matchesCount === 10) {
          document.getElementById('score-board').textContent = "Great Job! All 10 Matched Correctly! 🎉";
        }

        selectedScenario = null;
        selectedComponent = null;
        isChecking = false;
      } else {
        // INCORRECT MATCH -> Turn Red & Shake
        scenEl.classList.remove('selected');
        compEl.classList.remove('selected');

        scenEl.classList.add('incorrect');
        compEl.classList.add('incorrect');

        setTimeout(() => {
          scenEl.classList.remove('incorrect');
          compEl.classList.remove('incorrect');
          selectedScenario = null;
          selectedComponent = null;
          isChecking = false;
        }, 800);
      }
    }
  }

  function resetGame() {
    initGame();
  }

  window.onload = initGame;
</script>

</body>
</html>
